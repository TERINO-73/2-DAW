<!-- Contenedor principal -->
<div class="container my-4">
    <h1 class="text-center">Zonas List</h1>

    <!-- Tabla de tipos de mascotas -->
    <table class="table mt-4">
        <thead>
            <tr>
                <th>Name</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <!-- Recorrer los tipos de mascotas con la nueva sintaxis @for -->
            @for(zona of zonas; track $index) {
            <tr>
                <td>
                    <input type="text" class="form-control" [value]="zona.nombre" [disabled]="true" />
                </td>
                <td>
                    <!-- Botones Editar y Eliminar -->
                    <button class="btn btn-warning me-2" (click)="editZona(zona)" style="min-width: 100px;">Edit</button>
                    <button class="btn btn-danger" (click)="eliminarZona(zona.id)" style="min-width: 100px;">Delete</button>
                </td>
            </tr>
        }
        </tbody>
    </table>
    <button type="button" routerLink="/formlocal/{{idL}}">Volver</button>
    <button type="button" class="btn btn-dark" (click)="addNewZona()" style="min-width: 150px;">New Zona</button>

    @if (showForm) {
        <app-zonas-form
        [addMode]="addMode" 
        [typeToEdit]="typeToEdit" 
        (cancel)="showForm = false ; typeToEdit = null" 
        (typeAddedMod)="ngOnInit()">
    </app-zonas-form>
    }
</div>
