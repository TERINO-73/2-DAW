<!-- Contenedor principal -->
<div class="container my-4">
    <h1 class="text-center">{{ addMode ? 'Add Pet' : 'Edit Pet'}}</h1>

    <!-- Formulario -->
    <form #petForm="ngForm" name="ngForm" (ngSubmit)="onSubmit(petForm.value)">
        
        <div class="mb-3">
            <label class="form-label">Owner:</label>
            <input type="text" name="owner" readonly value="{{owner.firstName}} {{owner.lastName}}" class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label">Name:</label>
            <input type="text" name="name" required [(ngModel)]="pet.name" #name="ngModel" class="form-control">
            <div class="text-danger" [hidden]="name.valid || name.pristine">
                Name is required
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Birth Date:</label>
            <input type="date" name="birthDate" required [(ngModel)]="pet.birthDate" #birthDate="ngModel" class="form-control">
            <div class="text-danger" [hidden]="birthDate.valid || birthDate.pristine">
                Birth Date is required
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Type:</label>
            <select name="type" required [(ngModel)]="pet.type.id" #type="ngModel" class="form-control">
                @for (type of petTypes; track $index) {
                    <option [ngValue]="type.id">{{type.name}}</option>
                }
            </select>
            <div class="text-danger" [hidden]="type.valid || type.pristine">
                Type is required
            </div>
        </div>

        <!-- Botones -->
        <div class="mb-3 d-grid gap-2 d-md-flex">
            <button type="submit" class="btn btn-primary" [disabled]="!petForm.valid" (click)="addMode ? insertarPet() : modificarPet()" style="min-width: 150px;">{{ addMode ? 'Add Pet' : 'Edit Pet'}}</button>
            <button type="button" class="btn btn-secondary" routerLink="/detailOwner/{{owner.id}}" style="min-width: 150px;">Cancel</button>
        </div>

    </form>

</div>
