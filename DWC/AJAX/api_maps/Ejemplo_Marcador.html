<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script type="text/javascript" src="http://maps.google.com/maps/api/js?key=AIzaSyBVmqqP1yZPn8x2x0B2vWjdrikAMsUtVAU">
    </script>
    
    <script type="text/javascript">
      
      function CargarMapa() {
      	
      	//  Creamos las opciones
      	var opciones = {
					center: new google.maps.LatLng(37.386719, -5.981365), // nos colocamos en Sevilla  
					zoom: 17
				};
				//  Dibujamos el mapa:
      	var mapa = new google.maps.Map(document.getElementById("divmapa"), opciones);
  			
  			//  Le asignamos el evento click al MAPA:
  			google.maps.event.addListener(mapa, 'click', function(e) {
    			ponVentana(e.latLng, mapa);
  			});
      }  //  CargarMapa()
      
      
      function ponVentana(pos, mapica) {
  			var infowindow = new google.maps.InfoWindow({
  				position: pos,
        	map: mapica,
        	content: "Latitud: " + pos.lat() + " <br />Longitud: " + pos.lng() 
      	});
  		}
      
      window.onload = CargarMapa;
      
    </script>
</head>
<body>
    
</body>
</html>
