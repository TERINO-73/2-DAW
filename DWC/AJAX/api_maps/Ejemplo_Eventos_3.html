    <script type="text/javascript">
		let mapa; // Declaramos el mapa como una variable global

		function CargarMapa() {
		  // Opciones iniciales del mapa
		  var opciones = {
			center: new google.maps.LatLng(37.386719, -5.981365), // Sevilla
			zoom: 17,
		  };

		  // Dibujamos el mapa
		  mapa = new google.maps.Map(document.getElementById("divmapa"), opciones);
  
		  // Evento de doble clic izquierdo para hacer zoom
		  google.maps.event.addListener(mapa, 'dblclick', function (e) {
			mapa.setZoom(mapa.getZoom() + 1); // Aumenta el zoom
			mapa.setCenter(e.latLng); // Centra el mapa donde se hizo clic
		  });
  
		  // Evento de doble clic derecho para reducir zoom
		  google.maps.event.addListener(mapa, 'rightclick', function (e) {
			mapa.setZoom(Math.max(mapa.getZoom() - 1, 0)); // Reduce el zoom sin que baje de 0
			mapa.setCenter(e.latLng); // Centra el mapa donde se hizo clic
		  });
  
		  // Muestra una ventana de información al hacer clic

			ponVentana(e.latLng, mapa);
		  });
