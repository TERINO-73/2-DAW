<div class="container my-4">
    <h2>{{ addMode ? 'Add Specialty' : 'Edit Specialty' }}</h2>
    <form #specialtyForm="ngForm" (ngSubmit)="onSubmit(specialtyForm.value)">
        <div class="form-group">
            <label for="specialtyName">Specialty Name: </label>
            @if (specialtyToEdit) {
                <input type="text" id="specialtyName" class="form-control" [(ngModel)]="editableSpecialty.name" name="name">
            }
            @else {
                <input type="text" id="specialtyName" class="form-control" [(ngModel)]="newSpecialty.name" name="name">
            }
        </div>
        <button type="submit" class="btn btn-primary mb-4 mt-2 me-4" style="min-width: 150px;">{{ addMode ? 'Add' : 'Save' }}</button>
        <button type="button" class="btn btn-secondary mb-4 mt-2" (click)="cancelar()" style="min-width: 150px;">Cancel</button>
    </form>
</div>
