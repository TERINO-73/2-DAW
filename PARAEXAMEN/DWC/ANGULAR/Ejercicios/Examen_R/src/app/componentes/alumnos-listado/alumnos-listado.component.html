<!-- Contenedor principal -->
<div class="container my-4">
    <h1 class="text-center">Owners List</h1>

    <!-- Contenedor de la tabla -->
    <div class="table-responsive">
        <!-- Tabla owners -->
        <table class="table table-hover">

            <thead>
                <!-- Encabezados de la tabla -->
                <tr>
                    <th>Id</th>
                    <th>nombre</th>
                    <th>apellidos</th>
                    <th>sexo</th>
                    <th>fechanacimiento</th>
                    <th>estadocivil</th>
                    <th>Del.</th>
                    <th>Mod.</th>
                </tr>
            </thead>

            <tbody class="table-group-divider">
                <!-- Contenido de la tabla -->

                <!-- Recorrer array listOwners -->
                 @for (a of listAlumnos; track $index) {
                    <tr>
                        
                        <!-- Link hacia el detalle del propietario -->
                        <td>{{a.id}}</td>
                        <td>{{a.nombre}}</td>
                        <td>{{a.apellidos}}</td>
                        <td>{{a.sexo_nombre}}</td>
                        <td>{{a.fecha_nacimiento | date:'dd-MM-yyyy'}}</td>
                        <td>{{a.nombre_ec}}</td>
                        <!-- <app-alumno-del   [alumnoViene]="{{a}}" 
                        (cancel)="showForm = false" 
                        (eliminado)="listAlumnos = $event"></app-alumno-del>
                        Botones -->
                        <td>
                            <button type="button" class="btn btn-warning" routerLink="/formAlum/{{a.id}}">M</button></td>
                            <td><button type="button" class="btn btn-danger ms-2">X</button>
                        </td>

                    </tr>
                 }
            </tbody>

        </table>

        <div>
            <button type="button" class="btn btn-dark" routerLink="/formAlum/-1">New Alumno</button>
        </div>
       

    </div>

  </div>
