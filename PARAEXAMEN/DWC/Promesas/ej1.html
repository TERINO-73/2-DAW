<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        const obtenerUsuariosP = () => {
            return new Promise((resolve, reject) => {
                setTimeout(() => {
                    resolve("Usuarios listos!!!");
                }, 3000)
            });
        }

        const obtenerClientesP = () => {
            return new Promise((resolve, reject) => {
                setTimeout(() => {
                    resolve("Clientes listos!!!");
                }, 2000)
            });
        }

        const obtenerProductosP = () => {
            return new Promise((resolve, reject) => {
                setTimeout(() => {
                    resolve("Productos listos!!!");
                }, 500)
            });
        }

        obtenerUsuariosP().reponse
        .then(obtenerClientesP)
        .then(obtenerProductosP)
        .catch(err=>console.log("err:",err));

    </script>
</head>
