<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8"/>
		<title>Plantilla</title>
		<style type="text/css">
			body{


        background-image: url(th-1794708069.png);
        background-repeat: no-repeat;
        background-size: 100%;
      }
      table {
  width: 100%;
  border-collapse: collapse;
  margin: 20px 0;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  box-shadow: 0 10px 20px rgba(0, 0, 0, 0.25);
  border-radius: 12px;
  overflow: hidden;
  background: linear-gradient(135deg, #a8e063, #56ab2f);
}

caption {
  color: #004400;
  font-weight: bold;
  font-size: 2em;
  padding: 15px;
  background-color: rgba(255, 255, 255, 0.8);
  border-bottom: 4px solid #004400;
  text-transform: uppercase;
  letter-spacing: 2px;
  text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.2);
}

thead th {
  background: linear-gradient(135deg, #43cea2, #185a9d);
  color: white;
  text-align: center;
  padding: 15px;
  font-size: 1.2em;
  text-transform: uppercase;
  letter-spacing: 1px;
  transition: background 0.3s ease;
}

thead th:hover {
  background: linear-gradient(135deg, #3ba88a, #164c7a);
  cursor: pointer;
}

tbody tr {
  background-color: rgba(255, 255, 255, 0.9);
  transition: background-color 0.3s ease, transform 0.3s ease;
}

tbody tr:nth-child(even) {
  background-color: rgba(240, 255, 240, 0.9);
}

tbody td {
  padding: 15px;
  text-align: center;
  font-size: 1.1em;
  color: #004d00;
}

tbody tr:hover {
  background-color: rgba(144, 238, 144, 0.9);
  transform: scale(1.02);
}

table, th, td {
  border: none;
}




      
			
		</style>
	</head>
	<body>
		<h2>Ejercicio. Dar Formato a una tabla</h2>
		<table id="TablaPersonas">
			<caption>Personas ..... IMPORTANTES</caption>
      <thead>
        <tr>
          <th>ID</th>
          <th>Nombre</th>
          <th>Apellidos</th>
          <th>Edad</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>1</td>
          <td>Sven Olof</td>
          <td>Joachim Palme</td>
          <td>86</td>
        </tr>
        <tr>
          <td>2</td>
          <td>Giovanni</td>
          <td>Falcone</td>
          <td>73</td>
        </tr>
        <tr>
          <td>3</td>
          <td>Paolo Emanuele</td>
          <td>Borsellino</td>
          <td>72</td>
        </tr>
        <tr>
          <td>4</td>
          <td>Salvador Guillermo</td>
          <td>Allende Gossens</td>
          <td>104</td>
        </tr>
      </tbody>
    </table>
		
	</body>
</html>
